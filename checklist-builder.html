<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Builder · Vehicle Check-In</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  .geotab-header { background: #0047BB; }
  .toggle { position:relative; width:44px; height:24px; display:inline-block; }
  .toggle input { opacity:0; width:0; height:0; }
  .slider { position:absolute; cursor:pointer; inset:0; background:#cbd5e1; border-radius:24px; transition:.25s; }
  .slider:before { content:''; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:white; border-radius:50%; transition:.25s; }
  input:checked+.slider { background:#0047BB; }
  input:checked+.slider:before { transform:translateX(20px); }
  .sidebar-item.active { background:#eff6ff; border-color:#93c5fd; }
  .assign-btn { border:2px solid #e2e8f0; border-radius:12px; padding:12px; text-align:center; cursor:pointer; transition:all .2s; background:white; width:100%; }
  .assign-btn.active { border-color:#0047BB; background:#eff6ff; }
  .assign-btn.active svg { color:#0047BB; }
  .assign-btn.active p { color:#1e40af; }
  #toast { transition:all .3s; }
  .loading-pill { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:#64748b; background:#f1f5f9; border-radius:20px; padding:3px 10px; }
</style>
</head>
<body class="bg-slate-50 h-full flex flex-col">

<!-- Header -->
<header class="geotab-header text-white px-5 py-3 flex items-center gap-3 shadow-lg z-10">
  <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
  <span class="font-semibold text-base">Checklist Builder</span>
  <span id="dbBadge" class="text-blue-300 text-xs bg-blue-900/40 px-2 py-0.5 rounded ml-1">demo_UK_smb_onboarding</span>
</header>

<div class="flex flex-1 overflow-hidden min-h-0">
  <!-- Sidebar -->
  <aside class="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0">
    <div class="p-3 border-b border-slate-100">
      <button onclick="newChecklist()" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1.5 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        New Checklist
      </button>
    </div>
    <div id="sidebar" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
  </aside>

  <!-- Editor -->
  <main class="flex-1 overflow-y-auto p-6 space-y-5">
    <div class="flex items-start justify-between gap-4">
      <input id="clName" type="text" placeholder="Checklist name…"
        class="text-2xl font-bold text-slate-800 bg-transparent border-b-2 border-transparent focus:border-blue-500 focus:outline-none flex-1 pb-0.5 placeholder:text-slate-300"
        oninput="renderApiPreview()">
      <div class="flex gap-2 pt-1">
        <button onclick="deleteChecklist()" class="text-sm text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg transition-colors">Delete</button>
        <button onclick="saveChecklist()" class="text-sm bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg font-medium transition-colors">Save</button>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <!-- Assign To — plain buttons, no radio/peer hack -->
      <div class="bg-white border border-slate-200 rounded-xl p-4">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-3">Assign Checklist To</p>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-driver" class="assign-btn active" onclick="setAssignType('driver')">
            <svg class="w-6 h-6 mx-auto mb-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <p class="text-sm font-medium text-slate-700">Driver</p>
            <p class="text-xs text-slate-400 mt-0.5">Shown when driver logs in</p>
          </button>
          <button id="btn-asset" class="assign-btn" onclick="setAssignType('asset')">
            <svg class="w-6 h-6 mx-auto mb-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 7h8M8 11h4m1 4l2-2 2 2M3 3h18v4l-2 2v10a2 2 0 01-2 2H7a2 2 0 01-2-2V9L3 7V3z"/></svg>
            <p class="text-sm font-medium text-slate-700">Vehicle</p>
            <p class="text-xs text-slate-400 mt-0.5">Shown when vehicle is used</p>
          </button>
        </div>
      </div>

      <!-- Assignment targets -->
      <div class="bg-white border border-slate-200 rounded-xl p-4">
        <div class="flex items-center justify-between mb-2">
          <p id="assignLabel" class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Select Drivers</p>
          <div class="flex items-center gap-2">
            <span id="dataSourceBadge" class="loading-pill hidden">
              <svg class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#94a3b8" stroke-width="3"/><path d="M12 2a10 10 0 0110 10" stroke="#0047BB" stroke-width="3" stroke-linecap="round"/></svg>
              Loading…
            </span>
            <input id="assignSearch" type="text" placeholder="Search…"
              class="text-xs border border-slate-200 rounded-lg px-2 py-2 w-56 focus:outline-none focus:border-blue-400 bg-white"
              oninput="onAssignSearch(this.value)">
          </div>
        </div>
        <div id="groupChips" class="flex flex-wrap gap-1 mb-2"></div>
        <div id="assignList" class="space-y-1 max-h-44 overflow-y-auto"></div>
      </div>
    </div>

    <!-- Options -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 flex items-center justify-between">
      <div>
        <p class="text-sm font-semibold text-slate-700">Require end-of-check photos</p>
        <p class="text-xs text-slate-400 mt-0.5">Driver must capture ≥ 1 vehicle photo before submitting</p>
      </div>
      <label class="toggle ml-4">
        <input type="checkbox" id="reqPhotos" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Items -->
    <div class="bg-white border border-slate-200 rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Checklist Items</p>
        <span id="itemCount" class="text-xs text-slate-400"></span>
      </div>
      <div id="itemsList" class="space-y-2 mb-3"></div>
      <button onclick="openAddItemModal()" class="w-full border-2 border-dashed border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-400 hover:text-blue-600 rounded-xl py-3 text-sm font-medium transition-all flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        Add Items
      </button>
    </div>

  </main>
</div>

<!-- ═══ Add Item Modal ═══════════════════════════════════════════════════════ -->
<div id="addItemModal" class="fixed inset-0 bg-black/50 z-50 items-center justify-center hidden" onclick="closeModalOnBg(event)">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl mx-4 max-h-[85vh] flex flex-col">
    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 shrink-0">
      <div>
        <h2 class="font-semibold text-slate-800">Add Checklist Items</h2>
        <p class="text-xs text-slate-400 mt-0.5">Select from common items or add a custom one below</p>
      </div>
      <button onclick="closeAddItemModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
    </div>

    <div class="flex-1 overflow-y-auto px-5 py-4 space-y-5" id="presetList">
      <!-- Rendered by JS -->
    </div>

    <div class="px-5 py-4 border-t border-slate-100 space-y-3 shrink-0">
      <div>
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-2">Custom Item</p>
        <div class="flex gap-2">
          <input id="customLabel" type="text" placeholder="Enter custom item label…"
                 class="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"
                 onkeydown="if(event.key==='Enter') addSelectedItems()">
          <select id="customType" class="border border-slate-200 rounded-lg px-2 py-2 text-sm focus:outline-none focus:border-blue-400 bg-white">
            <option value="pass_fail">Pass / Fail</option>
            <option value="yes_no">Yes / No</option>
            <option value="number">Number</option>
            <option value="text">Text</option>
          </select>
        </div>
      </div>
      <button onclick="addSelectedItems()" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-2.5 text-sm font-semibold transition-colors">
        Add Selected Items
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-xl opacity-0 translate-y-4 pointer-events-none">
  Saved
</div>

<script>
const ADDIN_ID = 'aVehicleChecklistAddin000001';

// ── Preset item library ───────────────────────────────────────────────────────
const PRESET_CATEGORIES = [
  { name: 'Exterior', items: [
    { label: 'Exterior body — no damage or dents', type: 'pass_fail' },
    { label: 'Windscreen — no cracks or chips', type: 'pass_fail' },
    { label: 'Windows — clean and undamaged', type: 'pass_fail' },
    { label: 'Mirrors — clean and correctly adjusted', type: 'pass_fail' },
    { label: 'Tyres — pressure and condition', type: 'pass_fail' },
    { label: 'Headlights — front working correctly', type: 'pass_fail' },
    { label: 'Brake & reversing lights — working', type: 'pass_fail' },
    { label: 'Indicators — front and rear', type: 'pass_fail' },
  ]},
  { name: 'Mechanical', items: [
    { label: 'Fluid levels — oil, coolant, washer', type: 'pass_fail' },
    { label: 'Fuel level adequate', type: 'pass_fail' },
    { label: 'Brakes — firm pedal feel', type: 'pass_fail' },
    { label: 'Dashboard warning lights — none active', type: 'pass_fail' },
    { label: 'Seatbelts — all functional', type: 'pass_fail' },
    { label: 'Horn — working', type: 'pass_fail' },
  ]},
  { name: 'Safety Equipment', items: [
    { label: 'Fire extinguisher — present and in date', type: 'pass_fail' },
    { label: 'First aid kit — present and stocked', type: 'pass_fail' },
    { label: 'Hi-vis vest — present in vehicle', type: 'pass_fail' },
    { label: 'Warning triangle — present', type: 'pass_fail' },
  ]},
  { name: 'Readings', items: [
    { label: 'Starting mileage / odometer (km)', type: 'number' },
    { label: 'Fuel level on departure (%)', type: 'number' },
    { label: 'Fuel level on return (%)', type: 'number' },
    { label: 'Brake pad thickness (mm)', type: 'number' },
    { label: 'Tyre tread depth (mm)', type: 'number' },
  ]},
  { name: 'Notes', items: [
    { label: 'General notes / observations', type: 'text' },
    { label: 'Incident or near-miss description', type: 'text' },
    { label: 'Maintenance requests', type: 'text' },
  ]},
];

const TYPE_LABEL = { pass_fail:'Pass/Fail', yes_no:'Yes/No', number:'Number', text:'Text' };

let DRIVERS       = [];
let VEHICLES      = [];
let GROUP_MAP     = {}; // id → name
let DRIVER_GROUPS = []; // [{id, name}] groups present on at least one driver
let VEHICLE_GROUPS= []; // [{id, name}] groups present on at least one vehicle
let templates     = [];
let activeId      = null;
let assignType    = 'driver';
let selected      = new Set();
let searchQuery   = '';
let activeGroups  = new Set();
let selectedPresets = new Map();

var _api = null;

// ── MyGeotab Add-In entry point ───────────────────────────────────────────────
if (typeof geotab === 'undefined') { var geotab = { addin: {} }; }
geotab.addin.vehicleChecklistBuilder = function() {
  return {
    initialize: function(api, state, callback) {
      _api = api;
      if (state && state.database) {
        document.getElementById('dbBadge').textContent = state.database;
      }
      loadFromApi();
      callback();
    },
    focus: function(api, state) {
      _api = api;
      renderSidebar();
      selectTemplate(activeId);
    },
    blur: function() {}
  };
};

function loadFromApi() {
  if (!_api) return;
  document.getElementById('dataSourceBadge').classList.remove('hidden');

  // Load checklist templates from AddInData
  _api.call('Get', {
    typeName: 'AddInData',
    search: { addInId: ADDIN_ID }
  }, function(results) {
    const loaded = results
      .map(function(r) {
        try {
          const d = r.details;
          if (d && d.type === 'ChecklistTemplate') {
            d.addInDataId = r.id;
            return d;
          }
        } catch(e) {}
        return null;
      })
      .filter(Boolean);

    if (loaded.length > 0) {
      templates = loaded;
      activeId = templates[0].id;
    } else {
      // Nothing saved yet — start with one blank template
      const blank = { id: 'cl-' + Date.now(), name: 'New Checklist', assignTo: 'driver', assigned: [], requirePhotos: true, items: [] };
      templates = [blank];
      activeId = blank.id;
    }
    document.getElementById('dataSourceBadge').classList.add('hidden');
    renderSidebar();
    selectTemplate(activeId);
  }, function() {
    document.getElementById('dataSourceBadge').classList.add('hidden');
  });

  // Load real drivers
  _api.call('Get', { typeName: 'User', search: { isDriver: true } }, function(users) {
    if (users && users.length) {
      DRIVERS = users.map(u => ({
        id: u.id,
        name: ((u.firstName||'') + ' ' + (u.lastName||'')).trim() || u.name || u.id,
        groups: (u.groups || []).map(g => g.id)
      })).sort((a, b) => a.name.localeCompare(b.name));
      buildDriverGroups();
    }
    if (assignType === 'driver') renderAssignList();
  }, function() {});

  // Load real vehicles/devices
  _api.call('Get', { typeName: 'Device', search: {} }, function(devices) {
    if (devices && devices.length) {
      VEHICLES = devices
        .filter(d => d.id && d.id !== 'b0')
        .map(d => ({
          id: d.id,
          name: d.name || d.id,
          licensePlate: (d.licensePlate || '').trim(),
          groups: (d.groups || []).map(g => g.id)
        }))
        .sort((a, b) => a.name.localeCompare(b.name));
      buildVehicleGroups();
    }
    if (assignType === 'asset') renderAssignList();
  }, function() {});

  // Load groups (for filter chips)
  _api.call('Get', { typeName: 'Group', search: {} }, function(groups) {
    if (groups && groups.length) {
      groups.forEach(g => { GROUP_MAP[g.id] = g.name || g.id; });
      buildDriverGroups();
      buildVehicleGroups();
      renderAssignList();
    }
  }, function() {});
}

// Build deduplicated group lists from loaded data
function buildDriverGroups() {
  const seen = new Set();
  DRIVER_GROUPS = [];
  DRIVERS.forEach(d => (d.groups || []).forEach(gId => {
    if (!seen.has(gId) && GROUP_MAP[gId]) { seen.add(gId); DRIVER_GROUPS.push({ id: gId, name: GROUP_MAP[gId] }); }
  }));
  DRIVER_GROUPS.sort((a, b) => a.name.localeCompare(b.name));
}

function buildVehicleGroups() {
  const seen = new Set();
  VEHICLE_GROUPS = [];
  VEHICLES.forEach(v => (v.groups || []).forEach(gId => {
    if (!seen.has(gId) && GROUP_MAP[gId]) { seen.add(gId); VEHICLE_GROUPS.push({ id: gId, name: GROUP_MAP[gId] }); }
  }));
  VEHICLE_GROUPS.sort((a, b) => a.name.localeCompare(b.name));
}

function getActive() { return templates.find(t => t.id === activeId); }

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  if (templates.length === 0) {
    document.getElementById('sidebar').innerHTML =
      '<p class="text-xs text-slate-400 px-3 py-6 text-center leading-relaxed">No checklists yet.<br>Click <strong>+ New Checklist</strong> to create one.</p>';
    return;
  }
  document.getElementById('sidebar').innerHTML = templates.map(t => {
    const isActive = t.id === activeId;
    return `
    <div class="sidebar-item border rounded-xl px-3 py-2.5 cursor-pointer transition-colors ${isActive ? '' : 'border-transparent hover:bg-slate-50'}"
         style="${isActive ? 'border-color:#93c5fd; background:#eff6ff;' : ''}"
         onclick="selectTemplate('${t.id}')">
      <p class="text-sm font-medium text-slate-800 truncate">${t.name}</p>
      <p class="text-xs text-slate-400 mt-0.5">${t.items.length} items · ${t.assignTo==='driver' ? 'By driver' : 'By vehicle'}</p>
    </div>`;
  }).join('');
}

function selectTemplate(id) {
  if (!id) return;
  activeId = id;
  const t = getActive();
  if (!t) return;
  document.getElementById('clName').value = t.name;
  assignType = t.assignTo;
  selected = new Set(t.assigned);
  searchQuery = '';
  activeGroups = new Set();
  const searchEl = document.getElementById('assignSearch');
  if (searchEl) searchEl.value = '';
  document.getElementById('reqPhotos').checked = t.requirePhotos;
  updateAssignButtons();
  renderAssignList();
  renderItems();
  renderApiPreview();
  renderSidebar();
}

// ── Assign type ───────────────────────────────────────────────────────────────
function setAssignType(type) {
  assignType = type;
  selected = new Set();
  searchQuery = '';
  activeGroups = new Set();
  document.getElementById('assignSearch').value = '';
  updateAssignButtons();
  renderAssignList();
  renderApiPreview();
}

function onAssignSearch(val) {
  searchQuery = val;
  renderAssignList();
}

function toggleGroup(gId) {
  activeGroups.has(gId) ? activeGroups.delete(gId) : activeGroups.add(gId);
  renderGroupChips();
  renderAssignList();
}

function renderGroupChips() {
  const groups = assignType === 'driver' ? DRIVER_GROUPS : VEHICLE_GROUPS;
  const el = document.getElementById('groupChips');
  if (groups.length < 2) { el.innerHTML = ''; return; }
  el.innerHTML = groups.map(g => {
    const on = activeGroups.has(g.id);
    const s = on
      ? 'border:1.5px solid #0047BB; border-radius:6px; padding:2px 8px; font-size:11px; background:#eff6ff; color:#1e40af; cursor:pointer;'
      : 'border:1.5px solid #e2e8f0; border-radius:6px; padding:2px 8px; font-size:11px; background:white; color:#64748b; cursor:pointer;';
    return `<button style="${s}" onclick="toggleGroup('${g.id}')">${escHtml(g.name)}</button>`;
  }).join('');
}

function updateAssignButtons() {
  [
    { id: 'btn-driver', active: assignType === 'driver' },
    { id: 'btn-asset',  active: assignType === 'asset'  }
  ].forEach(({ id, active }) => {
    const btn = document.getElementById(id);
    btn.style.border      = active ? '2px solid #0047BB' : '2px solid #e2e8f0';
    btn.style.borderRadius = '12px';
    btn.style.background  = active ? '#eff6ff' : 'white';
    const svg = btn.querySelector('svg');
    const ps  = btn.querySelectorAll('p');
    if (svg)   svg.style.color  = active ? '#0047BB' : '#94a3b8';
    if (ps[0]) ps[0].style.color = active ? '#1e40af' : '#374151';
    if (ps[1]) ps[1].style.color = active ? '#3b82f6' : '#94a3b8';
  });
}

function renderAssignList() {
  const pool = assignType === 'driver' ? DRIVERS : VEHICLES;
  document.getElementById('assignLabel').textContent = assignType === 'driver' ? 'Select Drivers' : 'Select Vehicles';

  const q = searchQuery.trim().toLowerCase();

  let visible = pool;
  if (activeGroups.size > 0) {
    visible = visible.filter(p => (p.groups || []).some(gId => activeGroups.has(gId)));
  }
  if (q) {
    visible = visible.filter(p => {
      const nameMatch = p.name.toLowerCase().includes(q);
      const regMatch  = assignType === 'asset' && (p.licensePlate || '').toLowerCase().includes(q);
      return nameMatch || regMatch;
    });
  }

  document.getElementById('assignList').innerHTML = visible.length
    ? visible.map(p => {
        const regTag = (assignType === 'asset' && p.licensePlate)
          ? ` <span style="font-size:11px; color:#94a3b8;">${escHtml(p.licensePlate)}</span>`
          : '';
        return `
        <label class="flex items-center gap-2.5 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" value="${p.id}" class="w-4 h-4 rounded text-blue-600 accent-blue-600"
                 ${selected.has(p.id) ? 'checked' : ''} onchange="toggleAssign('${p.id}')">
          <span class="text-sm text-slate-700">${escHtml(p.name)}${regTag}</span>
        </label>`;
      }).join('')
    : `<p class="text-xs text-slate-400 px-2 py-1">${pool.length ? 'No results' : 'None available'}</p>`;

  renderGroupChips();
}

function toggleAssign(id) {
  selected.has(id) ? selected.delete(id) : selected.add(id);
  renderApiPreview();
}

// ── Items list ────────────────────────────────────────────────────────────────
function renderItems() {
  const t = getActive();
  document.getElementById('itemCount').textContent = `${t.items.length} items`;
  document.getElementById('itemsList').innerHTML = t.items.map((item, idx) => `
    <div class="flex items-center gap-3 bg-slate-50 border border-slate-100 rounded-xl px-3 py-2.5">
      <span class="text-slate-300 text-xs select-none font-mono w-5 text-center">${idx+1}</span>
      <input type="text" value="${escHtml(item.label)}" placeholder="Item label…"
             class="flex-1 text-sm text-slate-700 bg-transparent focus:outline-none min-w-0"
             oninput="updateLabel('${item.id}', this.value)">
      <select onchange="updateType('${item.id}', this.value)"
              class="text-xs text-slate-500 bg-white border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:border-blue-400 shrink-0">
        ${Object.entries(TYPE_LABEL).map(([v,l]) => `<option value="${v}" ${item.type===v?'selected':''}>${l}</option>`).join('')}
      </select>
      <button onclick="removeItem('${item.id}')" class="text-slate-300 hover:text-red-400 transition-colors shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  `).join('');
}

function removeItem(id) {
  const t = getActive();
  t.items = t.items.filter(i => i.id !== id);
  renderItems();
  renderApiPreview();
}

function updateLabel(id, val) { getActive().items.find(i=>i.id===id).label = val; renderApiPreview(); }
function updateType(id, val)  { getActive().items.find(i=>i.id===id).type  = val; renderApiPreview(); }

// ── Add Item Modal ────────────────────────────────────────────────────────────
function openAddItemModal() {
  selectedPresets.clear();
  renderPresetList();
  document.getElementById('customLabel').value = '';
  document.getElementById('addItemModal').classList.remove('hidden');
  document.getElementById('addItemModal').classList.add('flex');
}

function closeAddItemModal() {
  document.getElementById('addItemModal').classList.add('hidden');
  document.getElementById('addItemModal').classList.remove('flex');
}

function closeModalOnBg(e) {
  if (e.target === document.getElementById('addItemModal')) closeAddItemModal();
}

function togglePreset(label, type) {
  if (selectedPresets.has(label)) {
    selectedPresets.delete(label);
  } else {
    selectedPresets.set(label, type);
  }
  renderPresetList();
}

function renderPresetList() {
  const existing = new Set(getActive().items.map(i => i.label));
  document.getElementById('presetList').innerHTML = PRESET_CATEGORIES.map(cat => `
    <div>
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">${cat.name}</p>
      <div class="flex flex-wrap gap-2">
        ${cat.items.map(item => {
          const alreadyAdded = existing.has(item.label);
          const isSelected = selectedPresets.has(item.label);
          const chipStyle = alreadyAdded
            ? 'border:1.5px solid #e2e8f0; border-radius:8px; padding:5px 10px; font-size:12px; display:flex; align-items:center; gap:6px; background:white; opacity:0.4; cursor:not-allowed; text-align:left;'
            : isSelected
              ? 'border:1.5px solid #0047BB; border-radius:8px; padding:5px 10px; font-size:12px; display:flex; align-items:center; gap:6px; background:#eff6ff; color:#1e40af; cursor:pointer; text-align:left;'
              : 'border:1.5px solid #e2e8f0; border-radius:8px; padding:5px 10px; font-size:12px; display:flex; align-items:center; gap:6px; background:white; cursor:pointer; text-align:left;';
          const badgeStyle = isSelected
            ? 'font-size:10px; padding:1px 5px; border-radius:4px; background:#bfdbfe; color:#1e40af; flex-shrink:0; margin-left:auto;'
            : 'font-size:10px; padding:1px 5px; border-radius:4px; background:#f1f5f9; color:#64748b; flex-shrink:0; margin-left:auto;';
          return `<button
            style="${chipStyle}"
            onclick="${alreadyAdded ? '' : `togglePreset(\`${item.label}\`, '${item.type}')`}"
            ${alreadyAdded ? 'title="Already in checklist"' : ''}>
            ${isSelected ? '<svg style="width:12px;height:12px;flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>' : ''}
            <span>${item.label}</span>
            <span style="${badgeStyle}">${TYPE_LABEL[item.type]}</span>
          </button>`;
        }).join('')}
      </div>
    </div>
  `).join('');
}

function addSelectedItems() {
  const t = getActive();
  if (!t) return;
  let added = 0;

  // Add selected presets
  selectedPresets.forEach((type, label) => {
    t.items.push({ id: 'i' + Date.now() + Math.random().toString(36).slice(2,6), label, type });
    added++;
  });

  // Add custom item if filled in
  const customLabel = document.getElementById('customLabel').value.trim();
  if (customLabel) {
    const customType = document.getElementById('customType').value;
    t.items.push({ id: 'i' + Date.now(), label: customLabel, type: customType });
    added++;
  }

  if (added === 0) { closeAddItemModal(); return; }

  renderItems();
  renderApiPreview();
  closeAddItemModal();
  toast(`Added ${added} item${added>1?'s':''}`);
}

// ── New / Delete / Save ───────────────────────────────────────────────────────
function newChecklist() {
  const t = { id:'cl-'+Date.now(), name:'New Checklist', assignTo:'driver', assigned:[], requirePhotos:true, items:[] };
  templates.unshift(t);
  selectTemplate(t.id);
  setTimeout(() => document.getElementById('clName').select(), 50);
}

function deleteChecklist() {
  if (templates.length <= 1) { toast('Cannot delete the only checklist'); return; }
  const t = getActive();
  if (_api && t.addInDataId) {
    _api.call('Remove', {
      typeName: 'AddInData',
      entity: { id: t.addInDataId }
    }, function() {}, function(err) { console.error('Delete failed', err); });
  }
  templates = templates.filter(tmpl => tmpl.id !== activeId);
  selectTemplate(templates[0].id);
  toast('Checklist deleted');
}

function saveChecklist() {
  const t = getActive();
  t.name = document.getElementById('clName').value.trim() || 'Untitled';
  t.assignTo = assignType;
  t.assigned = [...selected];
  t.requirePhotos = document.getElementById('reqPhotos').checked;
  renderSidebar();

  if (!_api) { toast('Saved locally (MyGeotab not connected)'); return; }

  const payload = {
    type: 'ChecklistTemplate',
    id: t.id, name: t.name, assignTo: t.assignTo,
    assigned: t.assigned, requirePhotos: t.requirePhotos,
    items: t.items, updatedAt: new Date().toISOString()
  };

  function onSaveErr(err) {
    const msg = err && (err.message || (typeof err === 'string' ? err : JSON.stringify(err)));
    console.error('Save failed', err);
    toast('Save failed: ' + (msg || 'unknown error'));
  }

  if (t.addInDataId) {
    _api.call('Set', {
      typeName: 'AddInData',
      entity: { id: t.addInDataId, addInId: ADDIN_ID, details: payload }
    }, function() { toast('Saved to MyGeotab'); }, onSaveErr);
  } else {
    _api.call('Add', {
      typeName: 'AddInData',
      entity: { addInId: ADDIN_ID, details: payload }
    }, function(id) { t.addInDataId = id; toast('Saved to MyGeotab'); }, onSaveErr);
  }
}

function renderApiPreview() {}

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('opacity-0','translate-y-4');
  el.classList.add('opacity-100','translate-y-0');
  setTimeout(() => { el.classList.add('opacity-0','translate-y-4'); el.classList.remove('opacity-100','translate-y-0'); }, 2800);
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderSidebar(); // renders empty state until MyGeotab calls initialize()
</script>
</body>
</html>
