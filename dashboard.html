<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Check-In Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  .geotab-header { background: #0047BB; }
  .kpi-value { font-size: 2rem; font-weight: 700; line-height: 1; }
  .badge-pass { background:#dcfce7; color:#15803d; }
  .badge-fail { background:#fee2e2; color:#dc2626; }
  .row-expanded { background:#f8fafc; }
  .item-pass { color:#16a34a; }
  .item-fail { color:#dc2626; }
  .item-na   { color:#94a3b8; }
  .photo-thumb { width:80px; height:60px; object-fit:cover; border-radius:8px; cursor:pointer; transition:transform .15s; }
  .photo-thumb:hover { transform:scale(1.05); }
  #lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100; align-items:center; justify-content:center; }
  #lightbox.open { display:flex; }
  #lightboxImg { max-width:90vw; max-height:90vh; border-radius:12px; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover td { background:#f1f5f9; }
</style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- Header -->
<header class="geotab-header text-white px-6 py-3 flex items-center gap-3 shadow-lg">
  <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
  <span class="font-semibold text-base">Check-In Dashboard</span>
  <span id="dbBadge" class="text-blue-300 text-xs bg-blue-900/40 px-2 py-0.5 rounded ml-1">—</span>
</header>

<div class="max-w-7xl mx-auto px-6 py-6 space-y-5">

  <!-- KPI Cards -->
  <div class="grid grid-cols-4 gap-4">
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Total Submissions</p>
      <p id="kpiTotal" class="kpi-value text-slate-800">—</p>
      <p class="text-xs text-slate-400 mt-2">All time</p>
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Pass Rate</p>
      <p id="kpiPassRate" class="kpi-value text-green-600">—</p>
      <p class="text-xs text-slate-400 mt-2">Overall</p>
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Issues Flagged</p>
      <p id="kpiIssues" class="kpi-value text-red-500">—</p>
      <p class="text-xs text-slate-400 mt-2">Total items failed</p>
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Photos Captured</p>
      <p id="kpiPhotos" class="kpi-value text-blue-600">—</p>
      <p id="kpiPhotosLabel" class="text-xs text-slate-400 mt-2">Avg per check</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-2xl px-5 py-4 shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center">
    <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest mr-2">Filter</p>
    <select id="fDate" onchange="applyFilters()" class="text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-400 text-slate-600 bg-white">
      <option value="">All dates</option>
      <option value="today">Today</option>
      <option value="week">Last 7 days</option>
      <option value="month">Last 30 days</option>
    </select>
    <select id="fVehicle" onchange="applyFilters()" class="text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-400 text-slate-600 bg-white">
      <option value="">All vehicles</option>
    </select>
    <select id="fDriver" onchange="applyFilters()" class="text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-400 text-slate-600 bg-white">
      <option value="">All drivers</option>
    </select>
    <select id="fStatus" onchange="applyFilters()" class="text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-400 text-slate-600 bg-white">
      <option value="">All statuses</option>
      <option value="pass">Pass only</option>
      <option value="fail">Fail only</option>
    </select>
    <button onclick="clearFilters()" class="ml-auto text-xs text-slate-400 hover:text-slate-600 px-3 py-2 rounded-lg hover:bg-slate-50 transition-colors">Clear</button>
    <span id="filterCount" class="text-xs text-slate-400"></span>
  </div>

  <!-- Retention banner -->
  <div id="retentionBanner" class="hidden bg-amber-50 border border-amber-200 rounded-2xl px-5 py-4 shadow-sm flex items-center justify-between gap-4 flex-wrap">
    <div class="flex items-center gap-3">
      <svg class="w-5 h-5 text-amber-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      </svg>
      <p id="retentionMsg" class="text-sm text-amber-800 font-medium"></p>
    </div>
    <div class="flex gap-2 shrink-0">
      <button onclick="exportArchive()"
        class="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold transition-colors">
        Export Archive
      </button>
      <button onclick="purgeOldRecords()"
        class="px-4 py-2 rounded-lg border border-amber-300 hover:bg-amber-100 text-amber-800 text-sm font-medium transition-colors">
        Purge
      </button>
    </div>
  </div>

  <!-- Loading state -->
  <div id="loadingState" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 py-16 text-center text-slate-400">
    <svg class="w-6 h-6 mx-auto mb-3 animate-spin text-blue-400" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
    </svg>
    <p class="text-sm">Loading submissions…</p>
  </div>

  <!-- Table -->
  <div id="tableWrapper" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-slate-100 bg-slate-50">
          <th class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-widest">Date &amp; Time</th>
          <th class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-widest">Driver</th>
          <th class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-widest">Vehicle</th>
          <th class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-widest">Checklist</th>
          <th class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-widest">Status</th>
          <th class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-widest">Issues</th>
          <th class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-widest">Photos</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyRow" class="hidden py-16 text-center text-slate-400 text-sm">No submissions found.</div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
const ADDIN_ID = 'a1Z2QF2s8nkajnj2rcMUsPQ';
let _api = null;
let RESPONSES = [];
let filtered = [];
let expandedId = null;

// ── MyGeotab add-in lifecycle ─────────────────────────────────────────────────
if (typeof geotab === 'undefined') { var geotab = { addin: {} }; }
geotab.addin.vehicleChecklistDashboard = function() {
  return {
    initialize: function(api, state, callback) {
      _api = api;
      if (state && state.database) {
        document.getElementById('dbBadge').textContent = state.database;
      }
      callback();
      loadData();
    },
    focus: function(api, state) { _api = api; loadData(); },
    blur: function() {}
  };
};

// ── Data loading ──────────────────────────────────────────────────────────────
function loadData() {
  setLoading(true);
  _api.call('Get', {
    typeName: 'AddInData',
    search: { addInId: ADDIN_ID }
  }, function(results) {
    RESPONSES = results
      .map(function(r) {
        var d = r.details || null;
        if (d && d.type === 'ChecklistResponse') {
          d._addInDataId = r.id;
          return d;
        }
        return null;
      })
      .filter(Boolean)
      .sort(function(a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); });
    buildFilterOptions();
    renderKPIs();
    applyFilters();
    checkRetention();
    setLoading(false);
  }, function(err) {
    console.error('AddInData fetch failed', err);
    setLoading(false);
  });
}

function setLoading(on) {
  document.getElementById('loadingState').classList.toggle('hidden', !on);
  document.getElementById('tableWrapper').classList.toggle('hidden', on);
}

function buildFilterOptions() {
  const drivers  = [...new Set(RESPONSES.map(r => r.driverName).filter(Boolean))].sort();
  const vehicles = [...new Set(RESPONSES.map(r => r.deviceName).filter(Boolean))].sort();

  document.getElementById('fDriver').innerHTML =
    '<option value="">All drivers</option>' + drivers.map(d => `<option>${d}</option>`).join('');
  document.getElementById('fVehicle').innerHTML =
    '<option value="">All vehicles</option>' + vehicles.map(v => `<option>${v}</option>`).join('');
}

function renderKPIs() {
  const total     = RESPONSES.length;
  const passCount = RESPONSES.filter(r => r.overallStatus === 'pass').length;
  const passRate  = total > 0 ? Math.round(passCount / total * 100) : 0;
  const issues    = RESPONSES.reduce((s, r) => s + (r.flaggedCount || 0), 0);
  const photos    = RESPONSES.reduce((s, r) => s + (r.photoCount  || 0), 0);
  const avg       = total > 0 ? (photos / total).toFixed(1) : '0.0';

  document.getElementById('kpiTotal').textContent      = total;
  document.getElementById('kpiPassRate').textContent   = passRate + '%';
  document.getElementById('kpiIssues').textContent     = issues;
  document.getElementById('kpiPhotos').textContent     = photos;
  document.getElementById('kpiPhotosLabel').textContent = 'Avg ' + avg + ' per check';
}

// ── Filters ───────────────────────────────────────────────────────────────────
function applyFilters() {
  const fD  = document.getElementById('fDate').value;
  const fV  = document.getElementById('fVehicle').value;
  const fDr = document.getElementById('fDriver').value;
  const fS  = document.getElementById('fStatus').value;
  const now = new Date();

  filtered = RESPONSES.filter(r => {
    const dt = new Date(r.submittedAt);
    if (fD === 'today' && (now - dt) > 86400000)      return false;
    if (fD === 'week'  && (now - dt) > 7  * 86400000) return false;
    if (fD === 'month' && (now - dt) > 30 * 86400000) return false;
    if (fV  && r.deviceName !== fV)  return false;
    if (fDr && r.driverName !== fDr) return false;
    if (fS  && r.overallStatus !== fS) return false;
    return true;
  });
  expandedId = null;
  renderTable();
}

function clearFilters() {
  ['fDate','fVehicle','fDriver','fStatus'].forEach(id => document.getElementById(id).value = '');
  applyFilters();
}

// ── Table ─────────────────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('tableBody');
  document.getElementById('filterCount').textContent = `${filtered.length} of ${RESPONSES.length} results`;
  document.getElementById('emptyRow').classList.toggle('hidden', filtered.length > 0);

  tbody.innerHTML = filtered.map(r => {
    const dt      = new Date(r.submittedAt);
    const dateStr = dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
    const timeStr = dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    const isExp   = expandedId === r.id;

    return `
      <tr class="clickable border-b border-slate-100 ${isExp ? 'row-expanded' : ''}" onclick="toggleRow('${r.id}')">
        <td class="px-5 py-3.5">
          <p class="text-slate-700 font-medium">${dateStr}</p>
          <p class="text-xs text-slate-400">${timeStr}</p>
        </td>
        <td class="px-5 py-3.5 text-slate-700">${r.driverName || '—'}</td>
        <td class="px-5 py-3.5 text-slate-600 text-sm">${r.deviceName || '—'}</td>
        <td class="px-5 py-3.5 text-slate-600 text-sm">${r.templateName || '—'}</td>
        <td class="px-5 py-3.5">
          <span class="badge-${r.overallStatus} text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wide">${r.overallStatus}</span>
        </td>
        <td class="px-5 py-3.5">
          ${r.flaggedCount > 0
            ? `<span class="text-red-600 font-semibold text-sm">${r.flaggedCount} issue${r.flaggedCount > 1 ? 's' : ''}</span>`
            : `<span class="text-slate-300 text-sm">—</span>`}
        </td>
        <td class="px-5 py-3.5 text-slate-500 text-sm">${r.photoCount || 0} 📷</td>
        <td class="px-4 py-3.5 text-slate-300">
          <svg class="w-4 h-4 transition-transform ${isExp ? 'rotate-90' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </td>
      </tr>
      ${isExp ? expandedRow(r) : ''}
    `;
  }).join('');
}

function expandedRow(r) {
  const items = r.items || [];
  const itemsHtml = items.length > 0
    ? items.map(item => {
        const isFail = item.value === 'fail' || item.value === 'no';
        const isPass = item.value === 'pass' || item.value === 'yes';
        const colorClass = isFail ? 'item-fail' : isPass ? 'item-pass' : 'item-na';
        const icon = isFail ? '✕' : isPass ? '✓' : '—';
        return `
          <div class="flex items-start gap-3 py-2 border-b border-slate-100 last:border-0">
            <span class="${colorClass} font-bold text-sm w-4 shrink-0 mt-0.5">${icon}</span>
            <div class="flex-1 min-w-0">
              <p class="text-sm text-slate-700">${item.label}</p>
              ${item.note ? `<p class="text-xs text-slate-400 mt-0.5 italic">${item.note}</p>` : ''}
            </div>
            <span class="text-xs text-slate-500 shrink-0 ${colorClass}">${item.value || '—'}</span>
          </div>`;
      }).join('')
    : '<p class="text-xs text-slate-400 py-4 text-center">No items recorded</p>';

  const photoList  = r.photos || [];
  const photosHtml = photoList.length > 0
    ? photoList.map((src, i) => `<img class="photo-thumb" src="${src}" alt="Photo ${i+1}" onclick="openLightbox(event,'${r.id}',${i})">`).join('')
    : '<p class="text-xs text-slate-400">No photos</p>';

  return `
    <tr class="row-expanded">
      <td colspan="8" class="px-5 py-5">
        <div class="grid grid-cols-3 gap-6">
          <div class="col-span-2">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Checklist Responses</p>
            <div class="bg-white rounded-xl border border-slate-200 px-4 py-2">${itemsHtml}</div>
          </div>
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Photos (${photoList.length})</p>
            <div class="flex flex-wrap gap-2">${photosHtml}</div>
            <div class="mt-5 bg-slate-50 rounded-xl border border-slate-200 p-3">
              <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">AddInData record</p>
              <p class="text-xs font-mono text-slate-500 leading-relaxed">type: ChecklistResponse<br>id: ${r.id}<br>driver: ${r.driverName || '—'}<br>vehicle: ${r.deviceName || '—'}<br>submitted: ${new Date(r.submittedAt).toLocaleString('en-GB')}</p>
            </div>
          </div>
        </div>
      </td>
    </tr>`;
}

function toggleRow(id) {
  expandedId = expandedId === id ? null : id;
  renderTable();
}

// ── Retention ─────────────────────────────────────────────────────────────────
var RETENTION_DAYS = 60;

function oldRecords() {
  var cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - RETENTION_DAYS);
  return RESPONSES.filter(function(r) { return new Date(r.submittedAt) < cutoff; });
}

function checkRetention() {
  var old = oldRecords();
  var banner = document.getElementById('retentionBanner');
  if (old.length > 0) {
    document.getElementById('retentionMsg').textContent =
      old.length + ' submission' + (old.length !== 1 ? 's' : '') +
      ' are older than ' + RETENTION_DAYS + ' days and due for purge — export them before deleting.';
    banner.classList.remove('hidden');
  } else {
    banner.classList.add('hidden');
  }
}

function exportArchive() {
  var old = oldRecords();
  if (old.length === 0) { alert('No records older than ' + RETENTION_DAYS + ' days.'); return; }

  var headers = ['Date', 'Time', 'Driver', 'Vehicle', 'Checklist', 'Status', 'Issues Flagged', 'Photo Count'];
  var rows = old.map(function(r) {
    var dt = new Date(r.submittedAt);
    return [
      dt.toLocaleDateString('en-GB'),
      dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }),
      r.driverName || '',
      r.deviceName || '',
      r.templateName || '',
      (r.overallStatus || '').toUpperCase(),
      r.flaggedCount || 0,
      r.photoCount || 0
    ];
  });

  var detailHeaders = ['Submission ID', 'Date', 'Driver', 'Vehicle', 'Item', 'Response', 'Note'];
  var detailRows = [];
  old.forEach(function(r) {
    var dt = new Date(r.submittedAt).toLocaleDateString('en-GB');
    (r.items || []).forEach(function(item) {
      detailRows.push([r.id, dt, r.driverName || '', r.deviceName || '', item.label, item.value || '', item.note || '']);
    });
  });

  var wb = XLSX.utils.book_new();
  var ws = XLSX.utils.aoa_to_sheet([headers].concat(rows));
  ws['!cols'] = [{wch:12},{wch:8},{wch:20},{wch:24},{wch:24},{wch:8},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws, 'Submissions');

  var wsD = XLSX.utils.aoa_to_sheet([detailHeaders].concat(detailRows));
  wsD['!cols'] = [{wch:24},{wch:12},{wch:20},{wch:24},{wch:40},{wch:10},{wch:40}];
  XLSX.utils.book_append_sheet(wb, wsD, 'Item Detail');

  var xlsxData = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });

  var zip = new JSZip();
  zip.file('submissions.xlsx', xlsxData, { base64: true });

  old.forEach(function(r) {
    (r.photos || []).forEach(function(dataUrl, i) {
      var base64 = dataUrl.split(',')[1];
      if (base64) zip.file('photos/' + r.id + '/photo_' + (i + 1) + '.jpg', base64, { base64: true });
    });
  });

  zip.generateAsync({ type: 'blob' }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    var db = document.getElementById('dbBadge').textContent || 'CheckIn';
    a.download = db.replace(/[^a-z0-9_\-]/gi, '_') + '_Archive_' + new Date().toISOString().slice(0, 10) + '.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
}

function purgeOldRecords() {
  var old = oldRecords();
  if (old.length === 0) return;
  if (!confirm('Permanently delete ' + old.length + ' submission' + (old.length !== 1 ? 's' : '') +
      ' older than ' + RETENTION_DAYS + ' days?\n\nExport the archive first if you haven\'t already. This cannot be undone.')) return;

  var toRemove = old.filter(function(r) { return r._addInDataId; });
  if (toRemove.length === 0) { alert('No records with a valid ID to remove.'); return; }

  var calls = toRemove.map(function(r) {
    return ['Remove', { typeName: 'AddInData', entity: { id: r._addInDataId } }];
  });

  _api.multiCall(calls, function() {
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - RETENTION_DAYS);
    RESPONSES = RESPONSES.filter(function(r) { return new Date(r.submittedAt) >= cutoff; });
    buildFilterOptions();
    renderKPIs();
    applyFilters();
    checkRetention();
  }, function(err) {
    console.error('Purge failed', err);
    alert('Purge failed — please try again.');
  });
}

// ── Lightbox ──────────────────────────────────────────────────────────────────
function openLightbox(e, rId, photoIdx) {
  e.stopPropagation();
  const r = RESPONSES.find(x => x.id === rId);
  const src = (r && r.photos || [])[photoIdx];
  if (!src) return;
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── Init ──────────────────────────────────────────────────────────────────────
applyFilters(); // renders empty table until MyGeotab calls initialize()
</script>
</body>
</html>
